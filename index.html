<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Enrole. — Software, thoughtfully engineered.</title>

  <meta
    name="description"
    content="Enrole. is a Gambian software engineering company building mobile, web, and desktop products for schools, businesses, and institutions."
  >

  <meta name="theme-color" content="#1A242B">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #1A242B;
      --surface: #151E24;
      --surface-elevated: #141D22;
      --bg-deep: #10181D;

      --accent: #DFFF4F;
      --accent-dim: #C7E647;

      --text: #F0F4F7;
      --text-muted: #94A3AE;
      --border: #2A3842;

      --success: #22C55E;
      --warning: #F59E0B;
      --info: #3B82F6;
      --error: #EF4444;

      --flag-red: #CE1126;
      --flag-blue: #0C1C8C;
      --flag-green: #3A7728;

      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --space-8: 64px;
      --space-9: 96px;

      --font-logo: "Inter", sans-serif;
      --font-display: "Space Grotesk", sans-serif;
      --font-body: "Manrope", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;

      --max-width: 1120px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .wrap {
      width: min(100% - 48px, var(--max-width));
      margin-inline: auto;
    }

    .wordmark {
      font-family: var(--font-logo);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .wordmark .dot {
      color: var(--accent);
    }

    .eyebrow {
      margin: 0 0 var(--space-4);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .flag-rule {
      width: 100%;
      height: 3px;
      background: linear-gradient(
        90deg,
        var(--flag-red) 0 32%,
        var(--text) 32% 34%,
        var(--flag-blue) 34% 66%,
        var(--text) 66% 68%,
        var(--flag-green) 68% 100%
      );
      opacity: 0.9;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .honeypot {
      position: absolute !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .toast {
      position: fixed;
      top: 88px;
      right: 24px;
      z-index: 100;
      display: flex;
      width: min(400px, calc(100% - 32px));
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .toast.success {
      border-color: rgba(34, 197, 94, 0.55);
    }

    .toast.error {
      border-color: rgba(239, 68, 68, 0.55);
    }

    .toast-icon {
      display: flex;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      color: var(--bg-deep);
    }

    .toast.success .toast-icon {
      background: var(--success);
    }

    .toast.error .toast-icon {
      background: var(--error);
    }

    .toast-icon svg {
      width: 14px;
      height: 14px;
    }

    .toast-message {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .toast-close {
      display: flex;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-muted);
    }

    .toast-close:hover {
      color: var(--text);
    }

    .toast-close svg {
      width: 16px;
      height: 16px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 36, 43, 0.88);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      color: var(--text-muted);
      font-size: 14px;
    }

    .nav-links a {
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text);
    }

    .nav-cta {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--bg-deep) !important;
      font-weight: 700;
    }

    .nav-toggle {
      display: none;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
    }

    .nav-toggle svg {
      display: inline-block;
      width: 19px;
      height: 19px;
    }

    .nav-toggle svg#closeIcon {
      display: none;
    }

    .nav-toggle.open svg#menuIcon {
      display: none;
    }

    .nav-toggle.open svg#closeIcon {
      display: inline-block;
    }

    .hero {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--space-9) 24px var(--space-8);
    }

    .hero h1 {
      max-width: 16ch;
      margin: 0 0 var(--space-5);
      font-family: var(--font-display);
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    .hero-sub {
      max-width: 58ch;
      margin: 0 0 var(--space-7);
      color: var(--text-muted);
      font-size: clamp(16px, 2vw, 19px);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .btn {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-deep);
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background: var(--accent-dim);
      transform: translateY(-1px);
    }

    .btn-ghost {
      border-color: var(--border);
      color: var(--text);
    }

    .btn-ghost:hover,
    .btn-ghost:focus-visible {
      border-color: var(--text-muted);
    }

    @media (max-width: 860px) {
      .pillars-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      .contact-grid {
        grid-template-columns: 1fr;
        gap: var(--space-6);
      }

      .contact-copy h2 {
        max-width: none;
      }
    }

    @media (max-width: 760px) {
      .nav-toggle {
        display: inline-flex;
      }

      .nav-links {
        position: fixed;
        inset: 72px 0 auto;
        display: none;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-4);
        padding: var(--space-5) 24px var(--space-6);
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        width: 100%;
        padding: var(--space-2) 0;
      }

      .nav-cta {
        width: auto !important;
        padding-inline: var(--space-4) !important;
      }
    }

    @media (max-width: 720px) {
      .build-grid {
        grid-template-columns: 1fr;
      }

      .product-card {
        padding: var(--space-6);
      }

      .product-meta {
        flex-direction: column;
        gap: var(--space-4);
      }
    }

    @media (max-width: 600px) {
      .wrap {
        width: min(100% - 32px, var(--max-width));
      }

      .hero {
        padding-inline: 16px;
      }

      .hero-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .contact-form-panel {
        padding: var(--space-5);
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .contact-choice .btn {
        width: 100%;
      }

      .footer-inner {
        flex-direction: column;
      }

      .footer-links {
        align-items: flex-start;
      }

      .socials,
      .legal-links {
        justify-content: flex-start;
      }

      .toast {
        top: 80px;
        right: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }

      .toast {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <span class="toast-icon" id="toastIcon" aria-hidden="true"></span>

    <p class="toast-message" id="toastMessage"></p>

    <button
      class="toast-close"
      id="toastClose"
      type="button"
      aria-label="Close notification"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <header class="nav">
    <div class="nav-inner wrap">
      <a class="wordmark" href="#top" aria-label="Enrole. home">
        Enrole<span class="dot">.</span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="#mission">Mission</a>
        <a href="#build">What we build</a>
        <a href="#product">Product</a>
        <a href="#beglitch">BeGlitch</a>
        <a href="#vision">Vision</a>
        <a class="nav-cta" href="#contact">Get in touch</a>
      </nav>

      <button
        class="nav-toggle"
        id="navToggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <svg id="menuIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>

        <svg id="closeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- keep the rest of your original page content here exactly as before -->
  </main>

  <script>
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');

    function setMenuState(isOpen) {
      navLinks.classList.toggle('open', isOpen);
      document.body.classList.toggle('menu-open', isOpen);
      navToggle.classList.toggle('open', isOpen);
      navToggle.setAttribute('aria-expanded', String(isOpen));
      navToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    }

    document.addEventListener('DOMContentLoaded', function () {
      setMenuState(navLinks.classList.contains('open'));
    });

    navToggle.addEventListener('click', function () {
      const isOpen = navLinks.classList.contains('open');
      setMenuState(!isOpen);
    });

    navLinks.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        setMenuState(false);
      });
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') setMenuState(false);
    });
  </script>
</body>
</html>
